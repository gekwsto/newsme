services:
  newsme-db:
    image: postgres:16
    container_name: newsme-db
    restart: always
    environment:
      POSTGRES_DB: newsme
      POSTGRES_USER: newsme_user
      POSTGRES_PASSWORD: Kinsen123!
    volumes:
      - newsme_pgdata:/var/lib/postgresql/data

  newsme-app:
    build:
      context: .
      target: app
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://newsme.gr}
    container_name: newsme-app
    restart: always
    env_file:
      - .env
    depends_on:
      - newsme-db
    ports:
      - "3025:3000"
    volumes:
      - ./public/uploads:/app/public/uploads

  maintenance:
    build:
      context: .
      target: maintenance
    env_file:
      - .env
    depends_on:
      - newsme-db
    profiles:
      - maintenance

volumes:
  newsme_pgdata:
